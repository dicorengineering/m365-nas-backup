name: Test and build Docker alpha
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - name: Audit runtime dependencies
        if: matrix.python == '3.13'
        run: python -m pip_audit -r requirements.txt --no-deps --disable-pip
      - run: node --check src/m365_nas_backup/static/app.js
      - name: Exercise the browser console with fake mail
        if: matrix.python == '3.13'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python -m scripts.browser_smoke
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python == '3.13'
        with:
          name: browser-preview
          path: build/browser/
          if-no-files-found: ignore
          retention-days: 30
  package:
    permissions:
      contents: read
      packages: write
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build portable container
        run: docker build --tag ghcr.io/dicorengineering/m365-nas-backup:0.1.0-alpha.4 .
      - name: Export classic archive and test fresh import on Docker 24
        run: python3 -m scripts.package_image
      - name: Test shipped Compose, persistence and resource limits with synthetic mail
        run: python3 -m scripts.container_smoke
      - name: Publish private image and verify registry pull
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m scripts.publish_image
      - name: Bundle prebuilt image and instructions
        run: |
          mkdir -p dist/docs
          cp compose.yaml dist/
          cp packaging/INSTALL.md dist/INSTALL.md
          cp docs/*.md dist/docs/
          cp build/*-report.json dist/
          printf '%s\n' "${{ github.sha }}" > dist/SOURCE-COMMIT.txt
          (cd dist && sha256sum *.tar.gz compose.yaml INSTALL.md *-report.json SOURCE-COMMIT.txt docs/*.md > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: M365Backup-0.1.0-alpha.4-docker-amd64
          path: dist/
          retention-days: 90
          if-no-files-found: error
