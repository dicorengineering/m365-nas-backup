name: Test and build Docker alpha
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - name: Audit runtime dependencies
        if: matrix.python == '3.13'
        run: python -m pip_audit -r requirements.txt --no-deps --disable-pip
      - run: node --check src/m365_nas_backup/static/app.js
      - name: Exercise the browser console with fake mail
        if: matrix.python == '3.13'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python -m scripts.browser_smoke
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python == '3.13'
        with:
          name: browser-preview
          path: build/browser/
          if-no-files-found: ignore
          retention-days: 30
  package:
    permissions:
      contents: write
      packages: write
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build portable container with licenses
        run: docker build --tag ghcr.io/dicorengineering/m365-nas-backup:0.1.0-alpha.8 .
      - name: Export classic archive and test fresh import on Docker 24
        run: python3 -m scripts.package_image
      - name: Test shipped Compose, persistence and resource limits with synthetic mail
        run: python3 -m scripts.container_smoke
      - name: Collect exact dependency sources and notices
        run: python3 -m scripts.collect_sources
      - name: Publish image and verify registry pull
        if: github.repository == 'dicorengineering/m365-nas-backup' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m scripts.publish_image
      - name: Bundle prebuilt image and instructions
        run: python3 -m scripts.bundle_release
      - uses: actions/upload-artifact@v4
        with:
          name: M365Backup-0.1.0-alpha.8-docker-amd64
          path: dist/release/
          retention-days: 90
          if-no-files-found: error
      - name: Prepare draft release for review
        if: github.repository == 'dicorengineering/m365-nas-backup' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create v0.1.0-alpha.8 --draft --prerelease --target "$GITHUB_SHA" --title "M365 NAS Backup 0.1.0-alpha.8" --notes-file RELEASE_NOTES.md dist/release/*
