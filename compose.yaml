# Pull the private image first; see docs/REGISTRY-INSTALL.md. An offline archive is also available.
services:
  backup:
    image: ghcr.io/dicorengineering/m365-nas-backup:0.1.0-alpha.5
    container_name: m365-nas-backup
    user: "10001:10001"
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - config:/config
      - data:/data
      - exports:/exports
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped
    stop_grace_period: 60s
volumes:
  config:
    name: m365nasbackup_config
  data:
    name: m365nasbackup_data
  exports:
    name: m365nasbackup_exports
